name: Port to Minecraft 26.2
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  port:
    if: "!contains(github.event.head_commit.message, '[26.2-port]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Save target build
        shell: bash
        run: |
          mkdir -p /tmp/target
          cp gradle.properties /tmp/target/gradle.properties
          cp build.gradle /tmp/target/build.gradle
          cp settings.gradle /tmp/target/settings.gradle
          cp -R src /tmp/target/src
      - name: Prepare 1.21.11 Yarn environment
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("gradle.properties")
          s = p.read_text()
          s = re.sub(r"^minecraft_version=.*$", "minecraft_version=1.21.11", s, flags=re.M)
          s = re.sub(r"^loader_version=.*$", "loader_version=0.19.3", s, flags=re.M)
          s = re.sub(r"^loom_version=.*$", "loom_version=1.17.13", s, flags=re.M)
          s = re.sub(r"^fabric_api_version=.*$", "fabric_api_version=0.141.6+1.21.11", s, flags=re.M)
          if "yarn_mappings=" not in s:
              s += "\nyarn_mappings=1.21.11+build.4\n"
          p.write_text(s)

          p = Path("build.gradle")
          s = p.read_text()
          s = s.replace("net.fabricmc.fabric-loom", "net.fabricmc.fabric-loom-remap")
          marker = '    minecraft "com.mojang:minecraft:${project.minecraft_version}"\n'
          if "mappings " not in s:
              s = s.replace(marker, marker + '    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"\n')
          s = s.replace("implementation ", "modImplementation ")
          s = s.replace("options.release = 25", "options.release = 21")
          s = s.replace("JavaVersion.VERSION_25", "JavaVersion.VERSION_21")
          p.write_text(s)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle for migration
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Migrate Yarn source to Mojang mappings
        run: gradle migrateMappings --input "src/main/java" --output "src/main/java" --mappings "net.minecraft:mappings:1.21.11" --overrideInputsIHaveABackup --no-daemon
      - name: Restore 26.2 build files
        shell: bash
        run: |
          cp /tmp/target/gradle.properties gradle.properties
          cp /tmp/target/build.gradle build.gradle
          cp /tmp/target/settings.gradle settings.gradle
          rm -rf src
          cp -R /tmp/target/src src
          rm -rf src/main/java
          cp -R remappedSrc src/main/java
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle for 26.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Build 26.2
        run: gradle clean build --no-daemon --max-workers=1
      - name: Commit migrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[26.2-port] Migrate source to Minecraft 26.2" || exit 0
          git push