name: Port to Minecraft 26.2
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  port:
    if: "!contains(github.event.head_commit.message, '[26.2-port]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Save target build files
        run: |
          mkdir -p /tmp/target
          git show HEAD:gradle.properties > /tmp/target/gradle.properties
          git show HEAD:build.gradle > /tmp/target/build.gradle
          find src -name fabric.mod.json -print0 | while IFS= read -r -d '' f; do mkdir -p "/tmp/target/$(dirname "$f")"; git show "HEAD:$f" > "/tmp/target/$f"; done
      - name: Prepare old Yarn build
        run: |
          git checkout HEAD~3 -- gradle.properties build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Migrate Yarn to Mojang mappings
        run: gradle migrateMappings --mappings "net.minecraft:mappings:1.21.11" --no-daemon
      - name: Restore 26.2 build files
        run: |
          cp /tmp/target/gradle.properties gradle.properties
          cp /tmp/target/build.gradle build.gradle
          find /tmp/target/src -name fabric.mod.json -print0 | while IFS= read -r -d '' f; do target="${f#/tmp/target/}"; cp "$f" "$target"; done
      - name: Build 26.2
        run: |
          rm -rf build
          gradle clean build --no-daemon --max-workers=1
      - name: Commit migrated port
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[26.2-port] Migrate source to Minecraft 26.2" || exit 0
          git push