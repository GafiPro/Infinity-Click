name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'

      - name: Build
        run: gradle clean build --no-daemon --max-workers=1

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: infinity-click
          path: build/libs/*.jar
          retention-days: 3
